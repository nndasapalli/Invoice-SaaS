spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/InvoiceSaaS?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 11012000
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration